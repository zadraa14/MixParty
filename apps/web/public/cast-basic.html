<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MixParty Cast Basic Test</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #05050d;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      text-align: center;
    }

    .card {
      width: min(82vw, 760px);
      box-sizing: border-box;
      padding: 42px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 32px;
      background: rgba(20, 14, 38, .92);
      box-shadow: 0 30px 100px rgba(0,0,0,.5);
    }

    .logo {
      width: 92px;
      height: 92px;
      object-fit: contain;
      margin-bottom: 18px;
    }

    .eyebrow {
      color: #d8b4fe;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0 10px;
      font-size: 38px;
    }

    p {
      margin: 0;
      color: rgba(255,255,255,.62);
      font-size: 18px;
      line-height: 1.5;
    }

    #status {
      margin-top: 24px;
      display: inline-block;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(16,185,129,.12);
      border: 1px solid rgba(110,231,183,.2);
      color: #a7f3d0;
      font-size: 14px;
      font-weight: 900;
    }
  </style>
</head>

<body>
  <main class="card">
    <img class="logo" src="/branding/icon.png" alt="MixParty" />
    <div class="eyebrow">MixParty · Receiver minimal</div>
    <h1>Google Cast OK</h1>
    <p>
      Cette page ne contient ni Next.js côté client, ni Socket.IO,
      ni PartyBrain, ni Karaoké.
    </p>
    <div id="status">Initialisation du Receiver…</div>
  </main>

  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>
    try {
      const context = cast.framework.CastReceiverContext.getInstance();

      context.addEventListener(
        cast.framework.system.EventType.READY,
        () => {
          document.getElementById("status").textContent = "Receiver READY";
        }
      );

      context.addEventListener(
        cast.framework.system.EventType.SENDER_CONNECTED,
        () => {
          document.getElementById("status").textContent = "Sender connecté ✅";
        }
      );

      context.addEventListener(
        cast.framework.system.EventType.SENDER_DISCONNECTED,
        () => {
          document.getElementById("status").textContent = "Sender déconnecté";
        }
      );

      context.start({
        disableIdleTimeout: true,
        statusText: "MixParty Cast Basic Test"
      });
    } catch (error) {
      document.getElementById("status").textContent =
        "Erreur Receiver : " + String(error);
      console.error(error);
    }
  </script>
</body>
</html>
