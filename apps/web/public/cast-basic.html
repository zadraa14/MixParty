<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MixParty Cast TV</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #05050d;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      text-align: center;
    }

    #mixparty-screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
      background: #05050d;
      display: none;
      z-index: 20;
    }

    #receiver-card {
      position: relative;
      z-index: 10;
    }

    .card {
      width: min(82vw, 760px);
      box-sizing: border-box;
      padding: 42px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 32px;
      background: rgba(20, 14, 38, .92);
      box-shadow: 0 30px 100px rgba(0,0,0,.5);
    }

    .logo {
      width: 92px;
      height: 92px;
      object-fit: contain;
      margin-bottom: 18px;
    }

    .eyebrow {
      color: #d8b4fe;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0 10px;
      font-size: 38px;
    }

    p {
      margin: 0;
      color: rgba(255,255,255,.62);
      font-size: 18px;
      line-height: 1.5;
    }

    #party-code {
      margin-top: 24px;
      font-size: 48px;
      font-weight: 900;
      letter-spacing: .12em;
      color: #ffffff;
    }

    #status {
      margin-top: 16px;
      display: inline-block;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(16,185,129,.12);
      border: 1px solid rgba(110,231,183,.2);
      color: #a7f3d0;
      font-size: 14px;
      font-weight: 900;
    }
  </style>
</head>

<body>
  <main id="receiver-card" class="card">
    <img class="logo" src="/branding/icon.png" alt="MixParty" />
    <div class="eyebrow">MixParty · Receiver TV</div>
    <h1>Connexion MixParty</h1>
    <p>
      Connexion à la soirée en cours…
    </p>
    <div id="party-code">—</div>
    <div id="status">Initialisation du Receiver…</div>
  </main>

  <iframe
    id="mixparty-screen"
    title="MixParty TV"
    allow="autoplay; fullscreen"
  ></iframe>

  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>
    const MIXPARTY_NAMESPACE = "urn:x-cast:fr.mixparty.display";

    try {
      const context = cast.framework.CastReceiverContext.getInstance();

      function normalizePartyCode(value) {
        return String(value || "")
          .trim()
          .toUpperCase()
          .replace(/[^A-Z0-9]/g, "")
          .slice(0, 12);
      }

      function openMixPartyDisplay(code, mode) {
        const safeCode = normalizePartyCode(code);
        if (!safeCode) return;

        const nextMode = mode === "karaoke" ? "karaoke" : "tv";
        const iframe = document.getElementById("mixparty-screen");
        const card = document.getElementById("receiver-card");

        const nextUrl =
          nextMode === "karaoke"
            ? `/party/${encodeURIComponent(safeCode)}/karaoke?cast=1`
            : `/party/${encodeURIComponent(safeCode)}?display=tv&cast=1`;

        if (iframe.getAttribute("src") !== nextUrl) {
          iframe.setAttribute("src", nextUrl);
        }

        iframe.style.display = "block";
        card.style.display = "none";
      }

      context.addCustomMessageListener(
        MIXPARTY_NAMESPACE,
        (event) => {
          const payload = event && event.data ? event.data : {};
          const code = normalizePartyCode(payload.partyCode || payload.code);
          const mode = payload.mode === "karaoke" ? "karaoke" : "tv";

          if (!code) return;

          document.getElementById("party-code").textContent = code;
          document.getElementById("status").textContent = "Ouverture de MixParty…";

          if (
            payload.type === "mixparty_party_code" ||
            payload.type === "mixparty_display" ||
            !payload.type
          ) {
            openMixPartyDisplay(code, mode);
          }

          try {
            if (event.senderId) {
              context.sendCustomMessage(
                MIXPARTY_NAMESPACE,
                event.senderId,
                {
                  type:
                    payload.type === "mixparty_display"
                      ? "mixparty_display_ack"
                      : "mixparty_party_code_ack",
                  partyCode: code,
                  mode: mode
                }
              );
            }
          } catch (error) {
            console.warn("ACK impossible", error);
          }
        }
      );

      context.addEventListener(
        cast.framework.system.EventType.READY,
        () => {
          document.getElementById("status").textContent = "Receiver READY";
        }
      );

      context.addEventListener(
        cast.framework.system.EventType.SENDER_CONNECTED,
        () => {
          document.getElementById("status").textContent = "Sender connecté ✅";
        }
      );

      context.addEventListener(
        cast.framework.system.EventType.SENDER_DISCONNECTED,
        () => {
          document.getElementById("status").textContent = "Sender déconnecté";
        }
      );

      context.start({
        customNamespaces: {
          [MIXPARTY_NAMESPACE]: cast.framework.system.MessageType.JSON
        },
        disableIdleTimeout: true,
        statusText: "MixParty Cast Party Code Test"
      });
    } catch (error) {
      document.getElementById("status").textContent =
        "Erreur Receiver : " + String(error);
      console.error(error);
    }
  </script>
</body>
</html>
